[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hret"
version = "0.1.0"
description = "HRET: Heterogeneous Information Network for Recommendation in Testing and Inspection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Liwen Zhang" },
    { name = "Weiping Li" },
    { name = "Tong Mo" },
    { name = "Weijie Chu" },
]
keywords = [
    "heterogeneous information network",
    "recommender system",
    "meta-path",
    "metapath2vec",
    "testing and inspection",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
    "torch>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Paper = "https://doi.org/10.1109/ICSS55994.2022.00038"

[tool.setuptools.packages.find]
include = ["hret*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end tests that train a model",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
